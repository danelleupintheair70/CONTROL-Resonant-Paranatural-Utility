<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doblarr</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efec">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191817">
<meta name="application-name" content="Doblarr">
<meta name="description" content="AI dubbing for your media library">
<style>
  /* Painted before any script runs, so a deep link never flashes another page. */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f3efec; color: #6f6862;
    font: 14px system-ui, sans-serif; }
  #boot[data-theme="dark"] { background: #191817; color: #a39b94; }
</style>
</head>
<body>
<div id="root"><div id="boot" role="status">Loading Doblarr…</div></div>
<script>try { if (localStorage.getItem('doblarr.theme') === 'dark') document.getElementById('boot').dataset.theme = 'dark'; } catch {}</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
