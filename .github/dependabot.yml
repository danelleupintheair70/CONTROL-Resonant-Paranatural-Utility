version: 2
# master only accepts promotion PRs from dev (see main-promotion.yml), so
# every update targets dev and ships with the next promotion.
updates:
  - package-ecosystem: pip        # requirements.txt + pyproject.toml
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker     # base images in the Dockerfiles
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # The GPU image pins CUDA 12 to match the cu128 torch wheels and
      # ctranslate2 (faster-whisper); a CUDA major bump is a manual move.
      - dependency-name: nvidia/cuda
        update-types: ["version-update:semver-major"]
